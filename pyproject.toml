[project]
name = "world-model-research"
version = "0.1.0"
description = "Paper-driven, reproducible world-model experiments"
requires-python = ">=3.11,<3.14"
dependencies = [
  "matplotlib>=3.9,<4",
  "numpy>=2.0,<3",
  "torch>=2.4,<3",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = [
  "03_memory",
  "04_uncertainty",
  "05_long_horizon",
  "06_reward_value",
  "07_planning",
  "08_imagination_rl",
  "09_spatial_representation",
  "10_video_world_model",
  "11_multimodal",
  "12_physical_ai",
  "90_evaluation",
  "99_integrated_world_model",
]
addopts = "-ra"
